[package]
name = "nexa-widgets"
version = "0.1.0"
description = "Nexa Island widgets: to-dos, clipboard history, water tracker, shelf, quick apps, world clocks, timers and lyrics — SQLite backed"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
